<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <title>Stockpile Strategist · Analyst casebook</title>
  <meta name="description" content="Eleven real US critical-mineral decisions, 2023–2026. Make each call, see what really happened, and what every option would have led to." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../v4/" title="Story mode"><span class="logo" aria-hidden="true">◆</span><span><b>Stockpile Strategist</b><span class="sub">Analyst casebook · real decisions, 2023–26</span></span></a>
    <div class="cb-progress" id="progress"></div>
    <div class="stats" id="score"></div>
    <div class="top-actions">
      <button class="ghost" id="btn-gloss">Key terms</button>
      <a class="ghost" href="../methods.html">Methods &amp; sources</a>
      <button class="ghost" id="btn-reset">Restart</button>
    </div>
  </header>

  <main class="cb-layout" id="game">
    <section class="panel cb-case" id="case" aria-live="polite"></section>
    <aside class="cb-side">
      <div class="panel" id="chart"></div>
      <div class="panel" id="stocks"></div>
      <div class="panel" id="chain"></div>
    </aside>
  </main>
  <main class="end hidden" id="end"></main>

  <div class="whyline hidden" id="whyline" aria-live="polite"></div>
  <div class="overlay hidden" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

  <script src="../data.js"></script>
  <script src="../data_cache.js"></script>
  <script src="../integrate.js"></script>
  <script src="../sim.js"></script>
  <script src="../montecarlo.js"></script>
  <script src="../v4/rst.js"></script>
  <script src="../v4/missions.js"></script>
  <script src="../v4/plain.js"></script>
  <script src="../v4/tour.js"></script>
  <script src="../v4/network.js"></script>
  <script src="cases.js"></script>
  <script src="paths.js"></script>
  <script src="app.js"></script>
</body>
</html>
